<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calca">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Calca</title>
<style>
  :root { --fg:#f2f2f2; --bg:rgba(20,20,20,.82); --acc:#e8b04a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font:14px/1.3 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #stage { position:fixed; inset:0; touch-action:none; overflow:hidden; }
  #ref { position:absolute; left:50%; top:50%; transform-origin:center center;
    pointer-events:none; user-select:none; -webkit-user-drag:none; display:none; will-change:transform; }

  #bar { position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--bg);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .sl { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .sl label { width:64px; font-size:12px; opacity:.8; }
  .sl input { flex:1; accent-color:var(--acc); }
  #rowDetail { display:none; }
  .btns { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .zoom { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; }
  .zoom button { font-weight:600; font-size:13px; }
  .zoom button:disabled { opacity:.3; }
  #cam { transform-origin:center center; }
  button { font:inherit; color:var(--fg); background:rgba(255,255,255,.1); border:0; border-radius:10px;
    padding:10px 2px; font-size:12px; }
  button.on { background:var(--acc); color:#111; }
  button:active { opacity:.7; }

  #show { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:6; display:none;
    width:44px; height:44px; border-radius:50%; background:var(--bg); font-size:18px; padding:0; }

  #intro { position:fixed; inset:0; z-index:10; background:#111; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:28px; text-align:center; gap:16px; }
  #intro h1 { margin:0; font-size:26px; font-weight:600; }
  #intro p { margin:0; max-width:320px; opacity:.8; }
  #intro button { background:var(--acc); color:#111; font-size:16px; padding:14px 28px; font-weight:600; }
  #err { color:#ff8a80; max-width:320px; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<div id="stage"><img id="ref" alt=""></div>

<button id="show" aria-label="Mostrar controles">☰</button>

<div id="bar">
  <div class="zoom">
    <button id="z05">0,5x</button>
    <button id="z1" class="on">1x</button>
    <button id="z2">2x</button>
  </div>
  <div class="sl"><label for="op">Opacidad</label><input id="op" type="range" min="5" max="100" value="50"></div>
  <div class="sl" id="rowDetail"><label for="det">Detalle</label><input id="det" type="range" min="1" max="100" value="55"></div>
  <div class="btns">
    <button id="bPhoto">Foto</button>
    <button id="bEdge">Contornos</button>
    <button id="bGray">B/N</button>
    <button id="bLock">Bloquear</button>
    <button id="bHide">Ocultar</button>
  </div>
</div>

<input id="file" type="file" accept="image/*" hidden>

<div id="intro">
  <h1>Calca</h1>
  <p>Apoya el móvil sobre un vaso mirando al papel, elige una foto de tu galería y calca viendo la imagen sobre el papel real.</p>
  <button id="go">Activar cámara</button>
  <p id="err"></p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam = $('cam'), stage = $('stage'), ref = $('ref'), file = $('file');
  const st = { x:0, y:0, s:1, r:0, locked:false, edge:false, gray:false, img:null, url:null, edgeUrl:null };
  let g = null, wake = null, edgeTimer = null;

  // ---------- Cámara ----------
  async function startCamera() {
    $('err').textContent = '';
    try {
      await openStream({ facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } });
      await findLenses();
      $('intro').style.display = 'none';
      keepAwake();
      markZoom(1);
    } catch (e) {
      $('err').textContent = (e && e.name === 'NotAllowedError')
        ? 'No has dado permiso a la cámara. Actívalo en los ajustes del navegador y vuelve a intentarlo.'
        : 'No se pudo abrir la cámara. ¿Estás usando la dirección https://?';
    }
  }
  // ---------- Lentes y zoom (0,5x / 1x / 2x) ----------
  const lens = { wide: null, main: null, cur: 'main' };
  const VIDEO = { width: { ideal: 1920 }, height: { ideal: 1080 } };

  async function openStream(video) {
    if (cam.srcObject) cam.srcObject.getTracks().forEach(t => t.stop());
    cam.srcObject = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    await cam.play().catch(() => {});
  }
  async function findLenses() {
    try {
      const back = (await navigator.mediaDevices.enumerateDevices())
        .filter(d => d.kind === 'videoinput' && /back|rear|trasera|posterior/i.test(d.label));
      const w = back.find(d => /ultra/i.test(d.label));
      const m = back.find(d => !/ultra|tele/i.test(d.label));
      lens.wide = w ? w.deviceId : null;
      lens.main = m ? m.deviceId : null;
    } catch (e) {}
    $('z05').disabled = !lens.wide;
  }
  async function applyZoom(z) {
    let hw = false;
    try {
      const t = cam.srcObject.getVideoTracks()[0];
      const caps = t.getCapabilities ? t.getCapabilities() : {};
      if (caps.zoom && caps.zoom.min <= z && caps.zoom.max >= z) {
        await t.applyConstraints({ advanced: [{ zoom: z }] });
        hw = true;
      }
    } catch (e) {}
    cam.style.transform = (hw || z === 1) ? 'none' : 'scale(' + z + ')';
  }
  function markZoom(z) {
    [['z05', 0.5], ['z1', 1], ['z2', 2]].forEach(p => $(p[0]).classList.toggle('on', p[1] === z));
  }
  async function openMain() {
    await openStream(lens.main
      ? Object.assign({ deviceId: { exact: lens.main } }, VIDEO)
      : Object.assign({ facingMode: { ideal: 'environment' } }, VIDEO));
    lens.cur = 'main';
  }
  async function setZoom(z) {
    if (!cam.srcObject) return;
    try {
      if (z === 0.5) {
        if (!lens.wide) return;
        if (lens.cur !== 'wide') {
          await openStream(Object.assign({ deviceId: { exact: lens.wide } }, VIDEO));
          lens.cur = 'wide';
        }
        cam.style.transform = 'none';
      } else {
        if (lens.cur !== 'main') await openMain();
        await applyZoom(z);
      }
      markZoom(z);
    } catch (e) {
      try { await openMain(); await applyZoom(1); markZoom(1); } catch (e2) {}
    }
  }
  $('z05').addEventListener('click', () => setZoom(0.5));
  $('z1').addEventListener('click', () => setZoom(1));
  $('z2').addEventListener('click', () => setZoom(2));

  $('go').addEventListener('click', startCamera);

  // ---------- Pantalla siempre encendida ----------
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && cam.srcObject) keepAwake();
  });

  // ---------- Imagen de referencia ----------
  $('bPhoto').addEventListener('click', () => file.click());
  file.addEventListener('change', () => {
    const f = file.files && file.files[0];
    if (!f) return;
    if (st.url) URL.revokeObjectURL(st.url);
    st.url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      st.img = im;
      st.edgeUrl = null;
      // Tamaño base: ajustado a la pantalla
      const k = Math.min(innerWidth * 0.9 / im.naturalWidth, innerHeight * 0.6 / im.naturalHeight);
      ref.style.width = Math.round(im.naturalWidth * k) + 'px';
      ref.style.height = Math.round(im.naturalHeight * k) + 'px';
      Object.assign(st, { x:0, y:-40, s:1, r:0 });
      ref.style.display = 'block';
      refresh();
    };
    im.src = st.url;
    file.value = '';
  });

  function refresh() {
    if (!st.img) return;
    if (st.edge) {
      if (!st.edgeUrl) st.edgeUrl = computeEdges(st.img, +$('det').value);
      ref.src = st.edgeUrl;
    } else {
      ref.src = st.url;
    }
    ref.style.opacity = $('op').value / 100;
    ref.style.filter = (st.gray && !st.edge) ? 'grayscale(1) contrast(1.4)' : 'none';
    ref.style.transform = 'translate(-50%,-50%) translate(' + st.x + 'px,' + st.y + 'px) rotate(' + st.r + 'rad) scale(' + st.s + ')';
  }
  function place() {
    ref.style.transform = 'translate(-50%,-50%) translate(' + st.x + 'px,' + st.y + 'px) rotate(' + st.r + 'rad) scale(' + st.s + ')';
  }

  // ---------- Contornos (Sobel) ----------
  function computeEdges(im, detail) {
    const MAX = 900;
    const k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(im, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data;
    const gr = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) gr[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
    const b = new Float32Array(w * h);
    for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++) {
      const i = yy * w + xx;
      b[i] = (gr[i-w-1] + gr[i-w] + gr[i-w+1] + gr[i-1] + gr[i] + gr[i+1] + gr[i+w-1] + gr[i+w] + gr[i+w+1]) / 9;
    }
    const thr = 140 - detail * 1.2;
    const out = x.createImageData(w, h);
    for (let yy = 1; yy < h - 1; yy++) for (let xx = 1; xx < w - 1; xx++) {
      const i = yy * w + xx;
      const gx = -b[i-w-1] - 2*b[i-1] - b[i+w-1] + b[i-w+1] + 2*b[i+1] + b[i+w+1];
      const gy = -b[i-w-1] - 2*b[i-w] - b[i-w+1] + b[i+w-1] + 2*b[i+w] + b[i+w+1];
      const m = Math.sqrt(gx*gx + gy*gy);
      out.data[i*4+3] = Math.max(0, Math.min(255, (m - thr) * 6));
    }
    x.putImageData(out, 0, 0);
    return c.toDataURL('image/png');
  }

  // ---------- Controles ----------
  $('op').addEventListener('input', () => { ref.style.opacity = $('op').value / 100; });
  $('det').addEventListener('input', () => {
    clearTimeout(edgeTimer);
    edgeTimer = setTimeout(() => { st.edgeUrl = null; refresh(); }, 150);
  });
  $('bEdge').addEventListener('click', e => {
    st.edge = !st.edge;
    e.currentTarget.classList.toggle('on', st.edge);
    $('rowDetail').style.display = st.edge ? 'flex' : 'none';
    refresh();
  });
  $('bGray').addEventListener('click', e => {
    st.gray = !st.gray;
    e.currentTarget.classList.toggle('on', st.gray);
    refresh();
  });
  $('bLock').addEventListener('click', e => {
    st.locked = !st.locked;
    e.currentTarget.classList.toggle('on', st.locked);
    e.currentTarget.textContent = st.locked ? 'Bloqueada' : 'Bloquear';
  });
  $('bHide').addEventListener('click', () => { $('bar').style.display = 'none'; $('show').style.display = 'block'; });
  $('show').addEventListener('click', () => { $('bar').style.display = 'block'; $('show').style.display = 'none'; });

  // ---------- Gestos: 1 dedo mueve, 2 dedos escalan y giran ----------
  function snap(e) {
    const p = Array.from(e.touches);
    if (p.length === 1) g = { n:1, x:p[0].clientX, y:p[0].clientY };
    else if (p.length >= 2) {
      const a = p[0], c = p[1];
      g = { n:2, d:Math.hypot(c.clientX - a.clientX, c.clientY - a.clientY),
            a:Math.atan2(c.clientY - a.clientY, c.clientX - a.clientX),
            x:(a.clientX + c.clientX) / 2, y:(a.clientY + c.clientY) / 2 };
    } else g = null;
  }
  stage.addEventListener('touchstart', e => { if (st.locked) return; e.preventDefault(); snap(e); }, { passive:false });
  stage.addEventListener('touchmove', e => {
    if (st.locked || !g || !st.img) return;
    e.preventDefault();
    const p = Array.from(e.touches);
    if (g.n === 1 && p.length === 1) {
      st.x += p[0].clientX - g.x; st.y += p[0].clientY - g.y;
      g.x = p[0].clientX; g.y = p[0].clientY;
    } else if (g.n === 2 && p.length >= 2) {
      const a = p[0], c = p[1];
      const d = Math.hypot(c.clientX - a.clientX, c.clientY - a.clientY);
      const an = Math.atan2(c.clientY - a.clientY, c.clientX - a.clientX);
      const mx = (a.clientX + c.clientX) / 2, my = (a.clientY + c.clientY) / 2;
      if (g.d > 0) st.s = Math.max(0.1, Math.min(10, st.s * d / g.d));
      st.r += an - g.a;
      st.x += mx - g.x; st.y += my - g.y;
      g = { n:2, d, a:an, x:mx, y:my };
    }
    place();
  }, { passive:false });
  stage.addEventListener('touchend', e => { if (!st.locked) snap(e); });
  stage.addEventListener('touchcancel', () => { g = null; });

  // ---------- Service worker (permite instalarla y abrirla sin conexión) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
